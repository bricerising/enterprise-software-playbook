name: Archobs Tool

on:
  push:
    branches: [main]
    paths:
      - 'tools/archobs/**'
  pull_request:
    paths:
      - 'tools/archobs/**'

jobs:
  test:
    name: Test Archobs Tool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/archobs/pyproject.toml

      - name: Install codanna
        run: curl -fsSL --proto '=https' --tlsv1.2 https://install.codanna.sh | sh
        env:
          CODANNA_VERSION: v0.9.18

      - name: Install archobs (core)
        run: pip install -e 'tools/archobs'

      - name: Smoke test
        run: |
          set -euo pipefail
          python -m archobs --help
          archobs --help

      - name: Install test dependencies
        run: pip install pytest==9.0.2

      - name: Run unit tests
        run: pytest -q tools/archobs/tests
