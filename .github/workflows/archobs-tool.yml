name: Archobs Tool

on:
  push:
    paths:
      - 'tools/archobs/**'
  pull_request:
    paths:
      - 'tools/archobs/**'

jobs:
  test:
    name: Test Archobs Tool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: tools/archobs/pyproject.toml

      # SECURITY: curl-pipe-sh — consider vendoring or checksum verification
      - name: Install codanna
        run: curl -fsSL --proto '=https' --tlsv1.2 https://install.codanna.sh | sh

      - name: Install archobs (core)
        run: pip install -e 'tools/archobs'

      - name: Smoke test
        run: |
          set -euo pipefail
          python -m archobs --help
          archobs --help

      - name: Install test dependencies
        run: pip install pytest==9.0.2

      - name: Run unit tests
        run: pytest -q tools/archobs/tests
