name: Intelligence Tool

on:
  push:
    branches: [main]
    paths:
      - 'tools/intelligence/**'
  pull_request:
    paths:
      - 'tools/intelligence/**'

jobs:
  test:
    name: Test Intelligence Tool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/intelligence/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix tools/intelligence

      - name: Build
        run: npm run build --prefix tools/intelligence

      - name: Smoke test
        run: node tools/intelligence/dist/bin.js --help

      - name: Run tests
        run: npm test --prefix tools/intelligence
