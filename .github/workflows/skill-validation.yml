name: Skill Validation

on:
  push:
    paths:
      - 'skills/**'
      - 'specs/**'
      - '.system/skill-creator/**'
      - '.system/docs/**'
      - 'README.md'
      - 'PROMPTS.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'INSTALL.md'
  pull_request:
    paths:
      - 'skills/**'
      - 'specs/**'
      - '.system/skill-creator/**'
      - '.system/docs/**'
      - 'README.md'
      - 'PROMPTS.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'INSTALL.md'

jobs:
  validate:
    name: Validate Skills And Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Validate all skills
        run: |
          set -euo pipefail
          for skill_md in skills/*/SKILL.md; do
            [ -f "$skill_md" ] || continue
            d="${skill_md%/SKILL.md}"
            python3 .system/skill-creator/scripts/quick_validate.py "$d"
          done

      - name: Validate README/PROMPTS consistency
        run: |
          set -euo pipefail
          python3 .system/skill-creator/scripts/check_repo_consistency.py

      - name: Packaging smoke test
        run: |
          set -euo pipefail
          mkdir -p /tmp/skill-dist
          skill_count=0
          for skill_md in skills/*/SKILL.md; do
            [ -f "$skill_md" ] || continue
            d="${skill_md%/SKILL.md}"
            python3 .system/skill-creator/scripts/package_skill.py "$d" /tmp/skill-dist
            skill_count=$((skill_count + 1))
          done
          package_count="$(find /tmp/skill-dist -maxdepth 1 -type f -name '*.skill' | wc -l | tr -d ' ')"
          test "$package_count" -eq "$skill_count"

      - name: Documentation build check
        run: |
          set -euo pipefail
          pip install mkdocs-material==9.7.6
          python3 .system/docs/generate_mkdocs_nav.py > mkdocs.yml
          mkdocs build --strict
