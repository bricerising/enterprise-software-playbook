# Intelligence tool feed configuration
# Copy to ~/.config/intel/config.yaml and customize
#
# This is a minimal starter config. Add feeds that match your interests.
# Run `intel collect --once` after editing, then `intel stats` to verify.

database: ~/.local/share/intel/intelligence.db

collector:
  poll_interval_seconds: 300
  retention_days: 30
  edgar_contact: user@example.com

feeds:
  # -- Community (high signal-to-noise) --
  - source: hackernews
    name: Hacker News
    modes: [top]
    poll_interval: 300
    max_items: 50

  # -- Tech Earnings (SEC filings for major tech companies) --
  - source: earnings
    name: Tech Earnings
    poll_interval: 3600      # hourly — filings are infrequent

topics_file: ~/.config/intel/topics.yaml

output:
  format: json
  timezone: America/New_York
