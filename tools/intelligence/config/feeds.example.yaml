# Intelligence tool feed configuration
# Copy to ~/.config/intel/config.yaml and customize
#
# This is a minimal starter config. Add feeds that match your interests.
# Run `intel collect --once` after editing, then `intel stats` to verify.

database: ~/.local/share/intel/intelligence.db

collector:
  poll_interval_seconds: 300
  retention_days: 30

feeds:
  # -- Community (high signal-to-noise) --
  - source: hackernews
    name: Hacker News
    modes: [top]
    poll_interval: 300
    max_items: 50

topics_file: ~/.config/intel/topics.yaml

output:
  format: json
  timezone: America/New_York
