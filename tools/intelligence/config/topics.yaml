# Decision-relevant topic definitions for intelligence classification
# Taxonomy: Spec 013 — organized by SDLC decisions, not vendors
#
# Each topic has:
#   keywords: terms that trigger classification (case-insensitive)
#   regex: optional regex patterns for more precise matching
#   priority: higher values win when multiple topics match (1-100)
#   context_required: if true, short acronyms require surrounding context terms
#
# Priority bands (spec 013):
#   70-80: Security events (immediate attention)
#   55-65: AI developments (fast-moving)
#   40-55: Architecture, data, market, regulation (moderate pace)
#   35-45: Languages, compute (slower-moving)
#   30-40: DevEx and operations

