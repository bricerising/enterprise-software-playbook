# Decision-relevant topic definitions for intelligence classification
# Taxonomy: Spec 013 — organized by SDLC decisions, not vendors
#
# Revised 2026-05-06 from Leiden co-occurrence clustering on the full intel
# database (96,591 events, 50→44 topics). The previous 50-topic taxonomy had
# only 73% prefix-cluster purity; this revision raises that to 94%.
#
# Restructure:
#   New prefixes:  hw.*, cloud.*, build.*, code.*, finance.*
#   Retired:       arch.*, devex.*, data.*, lang.*, market.*, regulation.*
#   Kept:          ai.*, macro.*
#
# Merges (12 topics → 5):
#   arch.microservices + arch.event-driven + data.streaming
#       → build.distributed-systems   (NPMI 0.58, 0.52)
#   compute.cloud-platforms + security.cloud
#       → cloud.platforms             (NPMI 0.51)
#   lang.typescript + arch.frontend
#       → code.web                    (NPMI 0.36)
#   market.investment + market.funding
#       → finance.funding             (overlapping capital activity)
#   market.crypto + market.payments
#       → finance.crypto-payments     (formed isolated 2-topic community)
#
# Re-prefixed topics (moved to where they cluster, not what they "are about"):
#   compute.gpu/semiconductor → hw.*    (cluster with finance + macro)
#   data.stores/analytics, security.identity/cryptography, regulation.privacy,
#     arch.migration, compute.serverless-edge → cloud.*
#   compute.containers/iac, devex.*, security.supply-chain/vulnerabilities,
#     market.talent → build.*
#   lang.* → code.*
#   market.* → finance.*
#
# Each topic has:
#   keywords: terms that trigger classification (case-insensitive)
#   priority: higher values win when multiple topics match (1-100)
#   context_required: if true, short acronyms require surrounding context terms
#
# Priority bands (spec 013):
#   70-80: Security events (immediate attention)
#   55-65: AI developments (fast-moving)
#   40-55: Architecture, data, market, regulation (moderate pace)
#   35-45: Languages, compute (slower-moving)
#   30-40: DevEx and operations

